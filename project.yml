# Nape — Xcode projesi bu dosyadan üretilir: `xcodegen generate`
# .xcodeproj depoya girmez, her makinede yeniden üretilir.
name: Nape
options:
  bundleIdPrefix: com.batuhanhaymana
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  developmentLanguage: en
  generateEmptyDirectories: true
settings:
  base:
    DEVELOPMENT_TEAM: 4U5QVH3U6A
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
schemes:
  Nape:
    build:
      targets:
        Nape: all
    run:
      config: Debug
      storeKitConfiguration: Nape/Nape.storekit
    archive:
      config: Release
targets:
  Nape:
    type: application
    platform: iOS
    sources:
      - path: Nape
        excludes: ["Info.plist", "*.entitlements", "*.storekit"]
    entitlements:
      path: Nape/Nape.entitlements
      properties:
        com.apple.developer.usernotifications.time-sensitive: true
    info:
      path: Nape/Info.plist
      properties:
        CFBundleDisplayName: Nape
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
        NSSupportsLiveActivities: true
        NSMotionUsageDescription: Nape reads head orientation from your AirPods to measure how far your neck is tilted forward. Nothing leaves your device.
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - target: NapeWidgets
        embed: true
      - target: NapeWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.batuhanhaymana.nape
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        # Yalnız iPhone: iPad yok, Mac'te ve Vision Pro'da "iPhone için tasarlandı" modu da kapalı
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  NapeWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: NapeWidgets
      - path: Nape/Shared
      - path: Nape/Resources/Localizable.xcstrings
    info:
      path: NapeWidgets/Info.plist
      properties:
        CFBundleDisplayName: Nape
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.batuhanhaymana.nape.widgets
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  NapeWatch:
    type: application
    platform: watchOS
    sources:
      - path: NapeWatch
        excludes: ["Info.plist", "*.entitlements"]
      - path: Nape/Shared
        excludes: ["NapeActivityAttributes.swift"]
      - path: Nape/Resources/Localizable.xcstrings
    dependencies:
      - target: NapeWatchWidget
        embed: true
    entitlements:
      path: NapeWatch/NapeWatch.entitlements
      properties:
        com.apple.security.application-groups: [group.com.batuhanhaymana.nape]
    info:
      path: NapeWatch/Info.plist
      properties:
        CFBundleDisplayName: Nape
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        CFBundleIconName: AppIcon
        WKCompanionAppBundleIdentifier: com.batuhanhaymana.nape
        WKRunsIndependentlyOfCompanionApp: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown]
        WKBackgroundModes: [self-care]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.batuhanhaymana.nape.watchkitapp
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  NapeWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: NapeWatchWidget
        excludes: ["Info.plist", "*.entitlements"]
      - path: Nape/Shared
        excludes: ["NapeActivityAttributes.swift"]
      - path: Nape/Resources/Localizable.xcstrings
    entitlements:
      path: NapeWatchWidget/NapeWatchWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.batuhanhaymana.nape]
    info:
      path: NapeWatchWidget/Info.plist
      properties:
        CFBundleDisplayName: Nape
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.batuhanhaymana.nape.watchkitapp.widget
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
